<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4EE"/>
      <stop offset="50%" stop-color="#D9ECE0"/>
      <stop offset="100%" stop-color="#F5F9F6"/>
    </linearGradient>
    <linearGradient id="woodCarving" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A66E38"/>
      <stop offset="45%" stop-color="#804D20"/>
      <stop offset="85%" stop-color="#543111"/>
      <stop offset="100%" stop-color="#361D07"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Halo & Shadow -->
  <circle cx="400" cy="280" r="210" fill="none" stroke="#52B79A" stroke-width="1.5" opacity="0.25"/>
  <ellipse cx="400" cy="485" rx="220" ry="25" fill="#BEDCD0" opacity="0.6"/>

  <!-- Stylized Co Tu Woodcarving Pangolin (Tê tê cuộn tròn / dáng bò linh thú) -->
  <!-- Tail curving gracefully -->
  <path d="M190 350 C180 270, 240 210, 310 220 C300 250, 270 290, 240 330 C220 360, 200 370, 190 350 Z" fill="url(#woodCarving)"/>

  <!-- Main arched back -->
  <path d="M240 320 C270 200, 420 180, 520 250 C580 290, 600 350, 560 380 C500 420, 320 420, 240 320 Z" fill="url(#woodCarving)" stroke="#2B1604" stroke-width="3"/>

  <!-- Head & Snout -->
  <path d="M540 320 L620 335 L610 365 L550 375 Z" fill="url(#woodCarving)" stroke="#2B1604" stroke-width="2"/>
  <circle cx="585" cy="338" r="4.5" fill="#FAF5E8"/>
  <circle cx="586" cy="338" r="2.5" fill="#140B03"/>

  <!-- Carved Scale Motifs (Vảy tê tê khắc nổi hình cánh hoa / vòm cung truyền thống Cơ Tu) -->
  <g fill="none" stroke="#FAF1D8" stroke-width="2.5" opacity="0.75">
    <path d="M290 280 Q320 260 350 280"/>
    <path d="M340 270 Q370 250 400 270"/>
    <path d="M390 265 Q420 245 450 265"/>
    <path d="M440 270 Q470 250 500 270"/>

    <path d="M265 320 Q295 300 325 320"/>
    <path d="M315 310 Q345 290 375 310"/>
    <path d="M365 305 Q395 285 425 305"/>
    <path d="M415 305 Q445 285 475 305"/>
    <path d="M465 310 Q495 290 525 310"/>

    <path d="M290 355 Q320 335 350 355"/>
    <path d="M340 350 Q370 330 400 350"/>
    <path d="M390 345 Q420 325 450 345"/>
    <path d="M440 345 Q470 325 500 345"/>

    <path d="M320 390 Q350 370 380 390"/>
    <path d="M370 385 Q400 365 430 385"/>
    <path d="M420 385 Q450 365 480 385"/>
  </g>

  <!-- Sturdy legs -->
  <path d="M320 400 L305 460 L345 460 L355 405 Z" fill="#4A2A0E"/>
  <path d="M480 395 L495 460 L535 460 L520 390 Z" fill="#4A2A0E"/>

  <!-- Label Badge -->
  <rect x="230" y="510" width="340" height="40" rx="20" fill="#FFFFFF" opacity="0.9"/>
  <text x="400" y="535" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E332C" text-anchor="middle" letter-spacing="1.2">ĐIÊU KHẮC CON TÊ TÊ CƠ TU</text>
</svg>

