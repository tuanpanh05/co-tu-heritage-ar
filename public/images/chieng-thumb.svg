<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F0"/>
      <stop offset="50%" stop-color="#DCECE5"/>
      <stop offset="100%" stop-color="#F6FAF8"/>
    </linearGradient>
    <radialGradient id="gongBronze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7D488"/>
      <stop offset="35%" stop-color="#D4A359"/>
      <stop offset="70%" stop-color="#8C5C24"/>
      <stop offset="100%" stop-color="#4A3010"/>
    </radialGradient>
    <radialGradient id="gongBoss" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#E5B962"/>
      <stop offset="100%" stop-color="#7A4B17"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Halo & Shadow -->
  <circle cx="400" cy="275" r="210" fill="none" stroke="#52B79A" stroke-width="1.5" opacity="0.25"/>
  <ellipse cx="400" cy="485" rx="210" ry="26" fill="#BDDCD0" opacity="0.6"/>

  <!-- Gong Suspension Cord -->
  <path d="M400 90 L340 160 M400 90 L460 160" stroke="#7A4B17" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="85" r="10" fill="#237A63"/>

  <!-- Outer Gong Body -->
  <circle cx="400" cy="275" r="175" fill="url(#gongBronze)" stroke="#38240D" stroke-width="5"/>
  <circle cx="400" cy="275" r="162" fill="none" stroke="#FAF1D6" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="275" r="145" fill="none" stroke="#2B1A0A" stroke-width="3" stroke-dasharray="6,6"/>
  <circle cx="400" cy="275" r="120" fill="none" stroke="#FAF1D6" stroke-width="1.5" opacity="0.5"/>

  <!-- Concentric Rings & Sun Ray Engravings -->
  <circle cx="400" cy="275" r="85" fill="none" stroke="#4A3010" stroke-width="2.5"/>

  <!-- Central Boss (Núm chiêng) -->
  <circle cx="400" cy="275" r="46" fill="url(#gongBoss)" stroke="#3A2209" stroke-width="3"/>
  <ellipse cx="388" cy="263" rx="14" ry="10" fill="#FFFBE6" opacity="0.6"/>

  <!-- Label Badge -->
  <rect x="250" y="510" width="300" height="40" rx="20" fill="#FFFFFF" opacity="0.9"/>
  <text x="400" y="535" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1E332C" text-anchor="middle" letter-spacing="1.2">CHIÊNG ĐỒNG CƠ TU</text>
</svg>

